<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅行計劃彙整 - Travel Plans</title>
<style>
  :root {
    --primary: #0EA5E9;
    --primary-dark: #0284C7;
    --bg: #F8FAFC;
    --card: #FFFFFF;
    --text: #0C4A6E;
    --text-body: #334155;
    --text-muted: #64748B;
    --border: #E2E8F0;
    --shadow: 0 4px 12px rgba(0,0,0,0.06);
    --radius: 16px;
  }
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg); color: var(--text-body); line-height: 1.6; padding: 40px 20px;
  }
  .container { max-width: 900px; margin: 0 auto; }
  .header { margin-bottom: 32px; text-align: center; }
  .header h1 { font-size: 2.2rem; font-weight: 800; color: var(--text); margin-bottom: 8px; }
  .header p { color: var(--text-muted); font-size: 1rem; }
  .plan-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
  .plan-card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 24px; box-shadow: var(--shadow); transition: all 0.2s ease; text-decoration: none; color: inherit;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .plan-card:hover { transform: translateY(-4px); border-color: var(--primary); box-shadow: 0 8px 24px rgba(14,165,233,0.15); }
  .plan-tag { display: inline-block; padding: 4px 10px; background: #E0F2FE; color: var(--primary-dark); font-size: 0.78rem; font-weight: 600; border-radius: 99px; margin-bottom: 12px; }
  .plan-title { font-size: 1.15rem; font-weight: 700; color: var(--text); margin-bottom: 8px; }
  .plan-meta { font-size: 0.85rem; color: var(--text-muted); }
</style>
</head>
<body>
<div class="container">
  <header class="header">
    <h1>✈️ 旅行計劃特輯</h1>
    <p>精選多日旅行行程與路線指南</p>
  </header>

  <div class="plan-grid">
    <a href="北越河內-2026-10/北越優雅5日遊旅行計劃.html" class="plan-card">
      <div>
        <span class="plan-tag">2026-10 出發</span>
        <h2 class="plan-title">北越優雅 5 日遊</h2>
        <p class="plan-meta">下龍灣奢華日遊船 · 陸龍灣舟遊 · 河內古街</p>
      </div>
      <div style="margin-top: 16px; font-size: 0.85rem; font-weight: 600; color: var(--primary);">查看完整行程 ➔</div>
    </a>
  </div>
</div>
</body>
</html>
